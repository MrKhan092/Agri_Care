server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Required for React Router — sends all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container (missing before — this was
    # causing 405 errors, since without this block POST requests to /api/*
    # fell through to the static file handler above, which only allows GET)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}